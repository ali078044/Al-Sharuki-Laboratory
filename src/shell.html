<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مختبر الفيزياء التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-logo"><svg class="i" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21.5h11.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7 15h10"/></svg></div>
    <div><h1>مختبر الفيزياء التفاعلي</h1><small>صُمّم للأستاذ علي محمد الشاروكي</small></div></div>
  <nav class="nav">
    <button data-v="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>الرئيسية</span></button>
    <button data-v="catalog"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg><span>تجارب المنهج</span></button>
    <button data-v="examples"><svg class="i" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>الأمثلة المحلولة</span></button>
    <button data-v="maps"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="5" r="2"/><circle cx="20" cy="5" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/><path d="M6 6l4 4M18 6l-4 4M6 18l4-4M18 18l-4-4"/></svg><span>خرائط الفصول</span></button>
    <button data-v="lab"><svg class="i" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span>المختبر الحر</span></button>
    <button data-v="laws"><svg class="i" viewBox="0 0 24 24"><path d="M18 4H6l6 8-6 8h12"/></svg><span>القوانين</span></button>
  </nav>
  <button class="icon-btn" id="soundBtn" title="الصوت"><svg class="i" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <button class="icon-btn" id="themeBtn" title="الوضع الليلي"><svg class="i" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
</header>
<main>
  <section class="view" id="view-home"></section>
  <section class="view" id="view-catalog"></section>
  <section class="view" id="view-exp"></section>
  <section class="view" id="view-lab"></section>
  <section class="view" id="view-examples"></section>
  <section class="view" id="view-maps"></section>
  <section class="view" id="view-laws"></section>
</main>
<footer class="credit">مختبر الفيزياء التفاعلي للصف السادس العلمي — تم تصميمه للأستاذ <b>علي محمد الشاروكي</b></footer>
<script>
/*JS*/
App.init(); showSplash(); $('#soundBtn').onclick = () => { Sound.toggle(); $('#soundBtn').classList.toggle('off', !Sound.on); }; $('#soundBtn').classList.toggle('off', !Sound.on);
</script>
</body>
</html>
